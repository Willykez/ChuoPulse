name: Deploy backend (database, functions, AI key)

on:
  workflow_dispatch:
    inputs:
      push_database:
        description: Apply the SQL migrations
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_ID"

      - name: Apply migrations
        if: ${{ inputs.push_database }}
        run: supabase db push

      - name: Set AI secrets (only the ones that exist)
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          CLEANUP_SECRET: ${{ secrets.CLEANUP_SECRET }}
        run: |
          args=""
          [ -n "$AI_API_KEY" ]  && args="$args AI_API_KEY=$AI_API_KEY"
          [ -n "$AI_PROVIDER" ] && args="$args AI_PROVIDER=$AI_PROVIDER"
          [ -n "$AI_MODEL" ]    && args="$args AI_MODEL=$AI_MODEL"
          [ -n "$CLEANUP_SECRET" ] && args="$args CLEANUP_SECRET=$CLEANUP_SECRET"
          if [ -n "$args" ]; then supabase secrets set $args; else echo "No optional secrets set."; fi

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy admin-create-user
          supabase functions deploy admin-manage-user
          supabase functions deploy campus-wipe-files
          supabase functions deploy ai-analyze
          supabase functions deploy storage-cleanup
          supabase functions deploy confirm-signup --no-verify-jwt
