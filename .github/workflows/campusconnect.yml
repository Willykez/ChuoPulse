name: ChuoPulse build

# Builds a small (minified + shrunk) APK you can install. Database changes and Edge Functions
# are applied by hand in the Supabase dashboard, so there are no deploy jobs here.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore:
      - "supabase/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      variant:
        description: Which APK to build
        type: choice
        options: [staging, debug]
        default: staging
      lint:
        description: Also run Android lint (slower)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chuopulse-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  build:
    name: Build APK
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Check the app keys are set
        run: |
          for name in SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is missing (Settings > Secrets and variables > Actions)"
              exit 1
            fi
          done

      - name: Create temporary signing key
        run: |
          keytool -genkeypair -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Lint (optional)
        if: ${{ inputs.lint }}
        continue-on-error: true
        run: gradle --no-daemon :app:lintDebug --stacktrace

      - name: Build APK
        env:
          VARIANT: ${{ inputs.variant || 'staging' }}
        run: |
          if [ "$VARIANT" = "debug" ]; then task=assembleDebug; else task=assembleStaging; fi
          gradle --no-daemon ":app:$task" --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chuopulse-${{ inputs.variant || 'staging' }}-apk
          path: app/build/outputs/apk/${{ inputs.variant || 'staging' }}/*.apk
          if-no-files-found: error
          retention-days: 14

      # Lets you read crash reports from the minified build.
      - name: Upload mapping file
        if: ${{ (inputs.variant || 'staging') == 'staging' }}
        uses: actions/upload-artifact@v4
        with:
          name: chuopulse-mapping
          path: app/build/outputs/mapping/staging/mapping.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload lint report
        if: ${{ always() && inputs.lint }}
        uses: actions/upload-artifact@v4
        with:
          name: chuopulse-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Signed release (version tags only)
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is missing"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-key.p12" >> "$GITHUB_ENV"
          # Gradle also reads this file when it configures the project.
          keytool -genkeypair -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build signed APK and bundle
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          generate_release_notes: true
